<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子書暢銷榜盤點</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ffffff;
  --surface:#F3F4F1;
  --surface-raised:#ffffff;
  --ink-900:#1C2541;
  --ink-600:#4B5568;
  --ink-400:#808795;
  --border:#DFE1DC;
  --border-strong:#C7CAC3;
  --accent:#8C2F39;
  --accent-ink:#5C1E26;
  --accent-tint:#F6E9EA;
  --readmoo:#1F7A5C;
  --readmoo-tint:#E4F3ED;
  --readmoo-ink:#14503D;
  --kobo:#6A3FA0;
  --kobo-tint:#EFE7F7;
  --kobo-ink:#4B2C73;
  --books:#1D5FA8;
  --books-tint:#E5EFF9;
  --books-ink:#164A82;
  --shadow-sm:0 1px 2px rgba(28,37,65,0.06);
  --shadow-btn:0 1px 2px rgba(28,37,65,0.08),0 1px 1px rgba(28,37,65,0.05);
  --shadow-btn-hover:0 4px 10px rgba(28,37,65,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161F;
    --surface:#1B212C;
    --surface-raised:#1F2633;
    --ink-900:#EDEFF3;
    --ink-600:#AEB4C0;
    --ink-400:#7B8494;
    --border:#2B3241;
    --border-strong:#3A4254;
    --accent:#E08A93;
    --accent-ink:#F3C7CC;
    --accent-tint:#3A1F24;
    --readmoo:#6FD9AE;
    --readmoo-tint:#17352A;
    --readmoo-ink:#BEEBD4;
    --kobo:#C9A6F0;
    --kobo-tint:#2C2140;
    --kobo-ink:#DDC6F5;
    --books:#7FB4EA;
    --books-tint:#17293C;
    --books-ink:#BEDCF7;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
    --shadow-btn:0 1px 2px rgba(0,0,0,0.35),0 1px 1px rgba(0,0,0,0.25);
    --shadow-btn-hover:0 4px 12px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#12161F;
  --surface:#1B212C;
  --surface-raised:#1F2633;
  --ink-900:#EDEFF3;
  --ink-600:#AEB4C0;
  --ink-400:#7B8494;
  --border:#2B3241;
  --border-strong:#3A4254;
  --accent:#E08A93;
  --accent-ink:#F3C7CC;
  --accent-tint:#3A1F24;
  --readmoo:#6FD9AE;
  --readmoo-tint:#17352A;
  --readmoo-ink:#BEEBD4;
  --kobo:#C9A6F0;
  --kobo-tint:#2C2140;
  --kobo-ink:#DDC6F5;
  --books:#7FB4EA;
  --books-tint:#17293C;
  --books-ink:#BEDCF7;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
  --shadow-btn:0 1px 2px rgba(0,0,0,0.35),0 1px 1px rgba(0,0,0,0.25);
  --shadow-btn-hover:0 4px 12px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
button,a{cursor:pointer;}
button:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent-tint),0 0 0 3.5px var(--accent);border-radius:8px;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink-900);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding:0 20px;
}
.wrap{max-width:760px;margin:0 auto;padding-block:2rem 4rem;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.eyebrow{
  font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent);
  text-transform:uppercase;margin:0 0 .5rem;
}
h1{
  font-family:"Noto Serif TC",serif;font-weight:900;
  font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0 0 .6rem;
  color:var(--ink-900);text-wrap:balance;
}
.lede{font-size:17px;line-height:1.7;color:var(--ink-600);margin:0 0 1.75rem;max-width:60ch;}

.store-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.25rem;}
.store-btn{
  display:flex;flex-direction:column;gap:2px;width:100%;
  padding:14px 16px;border-radius:12px;border:1.5px solid var(--border-strong);
  box-shadow:var(--shadow-btn);cursor:pointer;font-family:inherit;text-align:left;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
}
.store-btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-btn-hover);}
.store-btn:active{transform:translateY(0);box-shadow:var(--shadow-btn);}
.store-btn[aria-pressed="true"]{border-color:var(--accent);border-width:2px;box-shadow:var(--shadow-btn-hover);}
.store-btn .name{font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.store-btn .sub{font-size:13px;color:var(--ink-400);display:flex;align-items:center;gap:4px;}
.store-btn .sub::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;}
.store-btn .radio-dot{width:18px;height:18px;flex-shrink:0;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface-raised);position:relative;transition:border-color .15s ease;}
.store-btn[aria-pressed="true"] .radio-dot{border-color:var(--accent);}
.store-btn[aria-pressed="true"] .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent);}
.store-readmoo{background:var(--readmoo-tint);}
.store-readmoo .name{color:var(--readmoo-ink);}
.store-kobo{background:var(--kobo-tint);}
.store-kobo .name{color:var(--kobo-ink);}
.store-books{background:var(--books-tint);}
.store-books .name{color:var(--books-ink);}

.hero-layout{display:flex;gap:16px;align-items:flex-start;margin-bottom:1.25rem;}
.month-sidebar{
  flex:0 0 152px;display:flex;flex-direction:column;gap:8px;
}
.month-sidebar button{
  font-family:inherit;font-size:14px;font-weight:500;text-align:left;
  padding:10px 14px;border-radius:10px;border:1.5px solid var(--border-strong);
  background:var(--surface-raised);color:var(--ink-600);box-shadow:var(--shadow-btn);
  transition:border-color .12s ease,box-shadow .12s ease,transform .1s ease;
}
.month-sidebar button:hover{border-color:var(--accent);transform:translateX(2px);}
.month-sidebar button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;box-shadow:var(--shadow-btn-hover);}
#chartPanel{flex:1 1 320px;min-width:0;}
@media (max-width:640px){
  .hero-layout{flex-direction:column;}
  .month-sidebar{flex-direction:row;overflow-x:auto;flex:0 0 auto;width:100%;padding-bottom:2px;}
  .month-sidebar button{flex:0 0 auto;white-space:nowrap;}
}

.chart-panel{
  background:var(--surface-raised);border:0.5px solid var(--border);border-radius:14px;
  padding:20px;margin-bottom:1.25rem;
}
.chart-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.chart-panel-head h3{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;margin:0;}
.chart-panel-head .ext-link{font-size:13px;font-weight:700;text-decoration:none;color:var(--accent-ink);white-space:nowrap;}
.chart-body{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.donut-wrap{flex:0 0 auto;}
.legend{list-style:none;margin:0;padding:0;flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:9px;max-height:280px;overflow-y:auto;}
.legend li{display:flex;align-items:center;gap:9px;font-size:14px;}
.legend .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.legend .lbl{flex:1;min-width:0;color:var(--ink-900);}
.legend .pct{font-weight:700;font-variant-numeric:tabular-nums;}
.legend .cnt{color:var(--ink-400);font-size:13px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;}

.panel{
  background:var(--surface);border-radius:14px;padding:16px;margin-bottom:1.25rem;
  display:flex;flex-direction:column;gap:14px;
}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chips button{
  font-family:inherit;font-size:14px;font-weight:500;
  padding:7px 14px;border-radius:999px;border:1.5px solid var(--border-strong);
  background:var(--surface-raised);color:var(--ink-600);box-shadow:var(--shadow-btn);
  transition:border-color .12s ease,box-shadow .12s ease,transform .1s ease;
}
.chips button:hover{border-color:var(--accent);transform:translateY(-1px);}
.chips button:active{transform:translateY(0);}
.chips button.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-tint);font-weight:700;box-shadow:var(--shadow-btn-hover);}
#search{
  flex:1 1 200px;min-width:0;font-family:inherit;font-size:15px;
  padding:9px 14px;border-radius:10px;border:0.5px solid var(--border);
  background:var(--surface-raised);color:var(--ink-900);height:38px;
}
#search:focus{outline:none;box-shadow:0 0 0 2px var(--accent-tint),0 0 0 1px var(--accent);}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem;}
.stat-card{background:var(--surface);border-radius:12px;padding:14px 16px;}
.stat-card .label{font-size:13px;color:var(--ink-400);margin:0 0 4px;}
.stat-card .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin:0;}
.stat-card.readmoo .value{color:var(--readmoo);}
.stat-card.kobo .value{color:var(--kobo);}
.stat-card.books .value{color:var(--books);}

.note{font-size:13px;color:var(--ink-400);line-height:1.6;margin:0 0 1.5rem;}

.list-head{
  display:grid;grid-template-columns:52px 1fr 88px 20px;gap:12px;padding:0 16px 8px;
  font-size:13px;color:var(--ink-400);font-weight:500;
}
.rank-list{list-style:none;margin:0;padding:0;border-top:0.5px solid var(--border);}
.rank-row{
  display:grid;grid-template-columns:52px 1fr 88px 20px;gap:12px;align-items:center;
  padding:14px 16px;border-bottom:0.5px solid var(--border);
  text-decoration:none;color:inherit;transition:background .1s ease;
}
.rank-row:hover{background:var(--surface);}
.rank-row:hover .row-ext{opacity:1;transform:translateX(2px);}
.row-ext{width:16px;height:16px;color:var(--ink-400);opacity:.55;transition:opacity .12s ease,transform .12s ease;justify-self:end;}
.rank-num{
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;
  color:var(--ink-400);font-variant-numeric:tabular-nums;
}
.rank-row.top .rank-num{color:var(--accent);}
.book-title{font-size:16px;font-weight:700;line-height:1.5;margin:0 0 2px;}
.book-author{font-size:14px;color:var(--ink-600);margin:0;}
.platform-badge{
  justify-self:end;font-size:12px;font-weight:700;padding:5px 10px;
  border-radius:999px;white-space:nowrap;
}
.platform-badge.readmoo{background:var(--readmoo-tint);color:var(--readmoo-ink);}
.platform-badge.kobo{background:var(--kobo-tint);color:var(--kobo-ink);}
.platform-badge.books{background:var(--books-tint);color:var(--books-ink);}
.empty-state{padding:40px 16px;text-align:center;color:var(--ink-400);font-size:15px;}

.fine-stats{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:1.5rem;}
.fine-stats h3{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700;margin:0 0 2px;}
.coverage{font-size:13px;color:var(--ink-400);margin:0 0 12px;}
.fine-table-wrap{max-height:340px;overflow-y:auto;border-top:0.5px solid var(--border);}
.fine-table{width:100%;border-collapse:collapse;font-size:14px;}
.fine-table td{padding:8px 4px;border-bottom:0.5px solid var(--border);}
.fine-table td.fine-rank{color:var(--ink-400);width:32px;font-variant-numeric:tabular-nums;}
.fine-table td.fine-count{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;width:56px;}
.fine-table tr:hover td{background:var(--surface-raised);}

@media (max-width:520px){
  .list-head{display:none;}
  .rank-row{grid-template-columns:36px 1fr 20px;grid-template-rows:auto auto;row-gap:4px;}
  .platform-badge{grid-column:2;grid-row:2;justify-self:start;}
  .row-ext{grid-row:1;}
  .rank-num{font-size:18px;}
}
</style>


</head>

    btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", m === state.month ? "true" : "false");
    btn.addEventListener("click", () => { state.month = m; renderAll(); });
    el.appendChild(btn);
  });
}

function renderPlatformChips(){
  const el = document.getElementById("platformChips");
  el.innerHTML = "";
  ["全部","讀墨","Kobo","博客來"].forEach(p => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = p;
    btn.className = p === state.platform ? "active" : "";
    btn.addEventListener("click", () => { state.platform = p; renderAll(); });
    el.appendChild(btn);
  });
}

function renderStatCards(){
  const el = document.getElementById("statCards");
  const monthData = DATA[state.month];
  const order = [["讀墨","readmoo","本"],["Kobo","kobo","本"],["博客來","books","本"]];
  el.innerHTML = order
    .filter(([label]) => monthData.platforms[label] != null)
    .map(([label, key, unit]) => `
    <div class="stat-card ${key}">
      <p class="label">${label}上榜書籍</p>
      <p class="value">${monthData.platforms[label] || 0} <span style="font-size:14px;font-weight:500;">${unit}</span></p>
    </div>
  `).join("");
}

function renderNote(){
  const el = document.getElementById("monthNote");
  const monthData = DATA[state.month];
  el.textContent = monthData.note ? `資料範圍：${monthData.note}` : "";
}

function renderFineStats(){
  const el = document.getElementById("fineStatsSection");
  const monthData = DATA[state.month];
  const stats = monthData.fine_stats;
  if (!stats || !stats.length){ el.innerHTML = ""; return; }
  const cov = monthData.fine_stats_coverage || {};
  const rows = stats.map((s, i) => `
    <tr>
      <td class="fine-rank">${i + 1}</td>
      <td>${escapeHtml(s.category)}</td>
      <td class="fine-count">${s.count}</td>
    </tr>
  `).join("");
  el.innerHTML = `
    <div class="fine-stats">
      <h3>細項分類統計（博客來最細分類）</h3>
      <p class="coverage">以博客來分類最細一層（例如「商業理財／投資理財／投資學」取「投資學」）統計，共 ${stats.length} 種細項；${cov.covered || 0}/${cov.total || 0} 本書取得分類。</p>
      <div class="fine-table-wrap">
        <table class="fine-table">${rows}</table>
      </div>
    </div>
  `;
}

function renderList(){
  const el = document.getElementById("rankList");
  const monthData = DATA[state.month];
  const q = state.q.trim().toLowerCase();
  let items = monthData.items;
  if (state.platform !== "全部") items = items.filter(it => it.platform === state.platform);
  if (q) items = items.filter(it =>
    (it.title || "").toLowerCase().includes(q) || (it.author || "").toLowerCase().includes(q)
  );

  if (items.length === 0){
    el.innerHTML = `<li class="empty-state">找不到符合條件的書籍，試試調整篩選或搜尋關鍵字。</li>`;
    return;
  }

  el.innerHTML = items.map(it => {
    const key = PLATFORM_KEY(it.platform);
    const top = it.rank <= 3 ? " top" : "";
    const href = it.url || "#";
    return `
      <li>
        <a class="rank-row${top}" href="${href}" target="_blank" rel="noopener">
          <span class="rank-num">${it.rank}</span>
          <span>
            <p class="book-title">${escapeHtml(it.title)}</p>
            <p class="book-author">${escapeHtml(it.author || "作者未標示")}</p>
          </span>
          <span class="platform-badge ${key}">${it.platform}</span>
          <svg class="row-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>
      </li>
    `;
  }).join("");
}

function buildDonut(slices, total){
  const size = 160, sw = 26;
  const r = (size - sw) / 2;
  const c = 2 * Math.PI * r;
  const n = slices.length;
  let offset = 0;
  const circles = slices.map((s, i) => {
    const len = (s.count / total) * c;
    const dashoffset = -offset;
    offset += len;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${sliceColor(i, n)}" stroke-width="${sw}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${size/2} ${size/2})"></circle>`;
  }).join("");
  const summary = slices.map(s => `${s.label} ${s.pct}%`).join("、");
  return `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="分類佔比：${summary}">${circles}</svg>`;
}

function renderChartPanel(){
  const el = document.getElementById("chartPanel");
  document.querySelectorAll(".store-btn").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.platform === state.chartPlatform ? "true" : "false");
  });

  const plat = state.chartPlatform;
  const pdata = PIE_DATA[state.month] && PIE_DATA[state.month][plat];
  if (!pdata){
    el.innerHTML = `
      <div class="chart-panel">
        <div class="chart-panel-head">
          <h3>${STORE_LABEL[plat]}．${MONTH_LABEL(state.month)}分類佔比</h3>
          <a class="ext-link" href="${STORE_LINK[plat]}" target="_blank" rel="noopener">前往即時排行榜 ↗</a>
        </div>
        <p class="coverage">這個期間沒有${STORE_LABEL[plat]}的排行資料可統計。</p>
      </div>
    `;
    return;
  }
  const donut = buildDonut(pdata.slices, pdata.total);
  const n = pdata.slices.length;
  const legend = pdata.slices.map((s, i) => `
    <li>
      <span class="swatch" style="background:${sliceColor(i, n)}"></span>
      <span class="lbl">${escapeHtml(s.label)}</span>
      <span class="pct">${s.pct}%</span>
      <span class="cnt">${s.count} 本</span>
    </li>
  `).join("");

  el.innerHTML = `
    <div class="chart-panel">
      <div class="chart-panel-head">
        <h3>${STORE_LABEL[plat]}．${MONTH_LABEL(state.month)}分類佔比</h3>
        <a class="ext-link" href="${STORE_LINK[plat]}" target="_blank" rel="noopener">前往即時排行榜 ↗</a>
      </div>
      <div class="chart-body">
        <div class="donut-wrap">${donut}</div>
        <ul class="legend">${legend}</ul>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderAll(){
  renderMonthSidebar();
  renderPlatformChips();
  renderStatCards();
  renderNote();
  renderFineStats();
  renderList();
  renderChartPanel();
}

document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value;
  renderList();
});

document.querySelectorAll(".store-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.chartPlatform = btn.dataset.platform;
    renderChartPanel();
  });
});

renderAll();
</script>

</body>
</html>
